name: Build nRFBox

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Arduino CLI
      uses: arduino/setup-arduino-cli@v1
      
    - name: Install ESP32 Core
      run: |
        arduino-cli core update-index --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
        arduino-cli core install esp32:esp32 --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
        
    - name: Install Libraries
      run: |
        # Biblioteca para CC1101 (via GitHub)
        mkdir -p ~/Arduino/libraries
        git clone https://github.com/LSatan/SmartRC-CC1101-Driver-Lib.git ~/Arduino/libraries/SmartRC-CC1101
        
        # Biblioteca para Display OLED
        arduino-cli lib install "U8g2"
        
        # Biblioteca para LEDs NeoPixel
        arduino-cli lib install "Adafruit NeoPixel"
        
    - name: Find and Compile
      run: |
        SKETCH=$(find . -name "*.ino" -type f | head -1)
        echo "Found sketch: $SKETCH"
        arduino-cli compile --fqbn esp32:esp32:esp32 "$SKETCH" --output-dir ./build
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: firmware
        path: build/*.bin
