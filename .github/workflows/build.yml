name: Build nRFBox

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Arduino CLI
      uses: arduino/setup-arduino-cli@v1
      
    - name: Install ESP32 Core
      run: |
        arduino-cli core update-index --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
        arduino-cli core install esp32:esp32 --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
        
    - name: Install Libraries
      run: |
        # Biblioteca para CC1101 (via GitHub)
        mkdir -p ~/Arduino/libraries
        git clone https://github.com/LSatan/SmartRC-CC1101-Driver-Lib.git ~/Arduino/libraries/SmartRC-CC1101
        
        # Bibliotecas do Library Manager
        arduino-cli lib install "U8g2"
        arduino-cli lib install "Adafruit NeoPixel"
        arduino-cli lib install "RF24"
        
    - name: Fix ALL filename case issues
      run: |
        cd ./nRFBox
        
        # Corrige Icone.h → icon.h
        [ -f "Icone.h" ] && mv Icone.h icon.h
        
        # Corrige CC1101.h → cc1101.h
        [ -f "CC1101.h" ] && mv CC1101.h cc1101.h
        
        # Corrige CC1101.cpp → cc1101.cpp (se existir)
        [ -f "CC1101.cpp" ] && mv CC1101.cpp cc1101.cpp
        
        # Lista arquivos para debug
        echo "Arquivos na pasta:"
        ls -la
        
    - name: Compile
      run: |
        arduino-cli compile --fqbn esp32:esp32:esp32 ./nRFBox/nRFBox.ino --output-dir ./build
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: firmware
        path: build/*.bin
