name: Build nRFBox

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Arduino CLI
      uses: arduino/setup-arduino-cli@v1
      
    - name: Install ESP32 Core
      run: |
        arduino-cli core update-index --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
        arduino-cli core install esp32:esp32 --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
        
    - name: Install CC1101 Library
      run: arduino-cli lib install "SmartRC-CC1101"
      
    - name: Find and Compile
      run: |
        # Encontra o arquivo .ino automaticamente
        SKETCH=$(find . -name "*.ino" -type f | head -1)
        echo "Found sketch: $SKETCH"
        
        # Compila com todas as bibliotecas locais do projeto
        arduino-cli compile --fqbn esp32:esp32:esp32 "$SKETCH" --output-dir ./build
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: firmware
        path: build/*.bin
